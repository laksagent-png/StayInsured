appId: com.stayinsured.legacy
productName: StayInsured Windows 7 probe

directories:
  output: dist

files:
  - out/**/*
  # The tests read the schema out of the Rust tree, which is not there once this is
  # installed, and nothing in the app calls them. They stay in the repository.
  - "!out/tests/**"
  - dist-ui/**/*
  - src/renderer/**/*
  - package.json

# The schema travels with the installer rather than being copied into this
# project, so the probe always tests the schema the Rust core actually ships.
extraResources:
  - from: ../src-tauri/src/db/schema
    to: schema
    filter:
      - "*.sql"
  # The tray icon travels the same way and for the same reason: it is the app's
  # own, not a second drawing of it, so both editions sit in the tray looking like
  # one program.
  - from: ../src-tauri/icons
    to: icons
    filter:
      - tray.png
      - tray@2x.png

# Both architectures, because a Windows 7 machine can be either and asking its
# owner which one they have is not a reasonable question. NSIS combines them into
# a single installer that picks the right build; the probe's environment table
# reports which one actually ran.
win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Deliberately no Windows version guard here. The main app's installer refuses
  # anything below Windows 10 1803; this one exists precisely to be run below it.
  artifactName: StayInsured-Win7-Probe-${version}.${ext}

# A Mac build answers none of the Windows 7 questions. It earns its place by
# exercising the packaged app: the schema is read from `process.resourcesPath`
# and the native module is loaded from an unpacked directory, neither of which
# `npm start` touches. A packaging mistake shows up here rather than on the
# virtual machine.
#
# Two separate builds rather than one universal binary. Merging a universal app
# means merging better-sqlite3's two native binaries, which buys nothing when
# the only readers of these files are developers who know which Mac they own.
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # Nothing signs this. An unsigned probe needs one Gatekeeper argument on
  # arrival, which the README spells out; a signing identity in CI for a
  # throwaway build is the greater cost.
  artifactName: StayInsured-Win7-Probe-${version}-${arch}.${ext}
