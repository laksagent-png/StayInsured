[package]
name = "stayinsured"
version = "0.5.0"
description = "Client and policy management for insurance providers"
authors = ["StayInsured"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "stayinsured_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
calamine = { version = "0.30.1", features = ["dates"] }
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
lettre = { version = "0.11.19", default-features = false, features = ["builder", "hostname", "smtp-transport", "pool", "rustls-tls"] }
parking_lot = "0.12.5"
rand = "0.9.5"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "chrono", "serde_json", "backup", "functions"] }
rust_xlsxwriter = "0.92.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.20.0", features = ["v4", "serde"] }

# The OS credential store differs per platform; each needs its own backend.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
