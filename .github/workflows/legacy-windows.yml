name: Build the Windows 7 probe

# Separate from **Build installers** on purpose. This builds the Electron edition
# in `legacy-windows/`, for the Windows versions the app itself refuses. It is a
# different application with a different core and no encryption, and its own tag
# prefix keeps it from ever being mistaken for an app release: `legacy-v0.0.4` does
# not match the `v*` trigger the real release uses.
#
# The name still says probe because the artifacts do. Renaming the product moves the
# folder an installed copy keeps its data in, which is not a thing to do in the same
# release that first gives it data worth keeping.
on:
  push:
    tags:
      - "legacy-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      # One platform failing should not hide what the other would have said.
      fail-fast: false
      matrix:
        include:
          # The installer the whole probe exists to produce.
          - platform: windows-latest
            label: Windows
            script: package:win
            files: legacy-windows/dist/*.exe
          # Answers nothing about Windows 7. It runs the packaged app on a
          # machine anyone here can reach, which is how a packaging mistake gets
          # caught before someone carries an installer to a virtual machine.
          - platform: macos-latest
            label: macOS
            script: package:mac
            files: legacy-windows/dist/*.dmg
    defaults:
      run:
        working-directory: legacy-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The version ends up in every artifact name, so a tag that disagrees with
      # it publishes files labelled with the wrong build. Cheaper to stop here.
      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#legacy-v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME expects version $tagged, but package.json declares $declared." >&2
            exit 1
          fi

      # `.npmrc` points native builds at Electron 22's ABI rather than the
      # runner's Node, which is what makes better-sqlite3 usable here at all.
      - name: Install
        run: npm ci --no-audit --no-fund

      # The interface is the app's own `src/`, built by the root project's Vite with
      # the Tauri imports aliased onto shims. `legacy-windows` carries no copy of
      # React, Tailwind or Vite, so without this the build has nothing to build with.
      #
      # Run from the root, which also keeps `legacy-windows/.npmrc` out of it: these
      # dependencies are for a build tool and must not be pinned to Electron's ABI.
      - name: Install the app's dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund

      # Neither runner can answer the Windows 7 question: one is Windows Server,
      # the other is a Mac. Both can prove the native module loads and the app's
      # real schema applies. The step fails the job on a bad check.
      - name: Run the probe
        run: npm run probe

      # The rules ported from `src-tauri/src/` held against the cases the Rust
      # suite holds them to. This runs on both platforms because the runner's OS
      # decides how SQLite sees dates and how the native module was built, and the
      # lapse sweep is a date comparison.
      - name: Run the core tests
        run: npm test

      - name: Build
        run: npm run ${{ matrix.script }}

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: StayInsured-Win7-Probe-${{ matrix.label }}
          if-no-files-found: error
          path: ${{ matrix.files }}

  # One release built from both jobs, rather than each job editing the same
  # release as it finishes and racing over the result.
  publish:
    name: Publish the prerelease
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Collect both builds
        uses: actions/download-artifact@v4
        with:
          path: builds

      # Marked as a prerelease so nobody browsing the releases page mistakes the
      # probe for a version of StayInsured they should install.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: Windows 7 probe ${{ github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: true
          files: builds/*/*
          body: |
            The Windows 7 edition of StayInsured, for machines the app itself
            refuses. It is a separate build on Electron 22 with the Rust core
            rewritten in TypeScript — not a version of StayInsured, and not
            supported alongside it. Do not point both at the same folder.

            **It does not encrypt your book.** StayInsured stores your clients in
            an encrypted database that the password unlocks. This edition cannot,
            and stores them in a plain file instead: the password still locks the
            app, but anyone who can copy that file — or a backup of it, or the
            disk — can read every client in it. The setup and security screens say
            so. Keep the machine itself secure.

            **It is unfinished, but less so.** Clients, policies, renewals, the
            dashboard, importing a spreadsheet, exporting, documents, and the
            reminder rules, message templates and outbox all work. What is left is
            the sweep that decides which reminders are due and the sending of them:
            those screens say so when you reach them rather than half working.

            It now sits in the notification area, locks from there, and hands a
            second launch to the copy already running.

            Run the `.exe` on Windows 7 SP1 or newer. It installs both the 64-bit
            and 32-bit builds and picks the one that fits. Launch it with
            `--probe` to see the checks that decided this edition was possible at
            all; the result is also saved as `probe-report.json` beside the data.

            The `.dmg` files are not for using the app. They exist so the packaged
            build can be run on a Mac, which catches packaging mistakes without a
            virtual machine. Nothing signs them, so macOS needs one argument
            before it will open one:

            ```
            xattr -dr com.apple.quarantine "/Applications/StayInsured Windows 7 probe.app"
            ```
