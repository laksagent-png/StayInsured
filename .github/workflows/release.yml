name: Build installers

# Tagging a version publishes a release with installers attached. Running the
# workflow by hand builds the same installers and leaves them as artifacts on
# the run, which is the way to test a build without announcing a version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary covers both Apple Silicon and Intel Macs, so
          # users are not asked which chip they have.
          - platform: macos-latest
            target: universal-apple-darwin
            label: macOS
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
            rust-targets: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check the tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match app version $version." >&2
            echo "Bump the version in src-tauri/tauri.conf.json, src-tauri/Cargo.toml" >&2
            echo "and package.json, then retag. Otherwise the installers ship" >&2
            echo "under a version number nobody asked for." >&2
            exit 1
          fi

      # The notes come from CHANGELOG.md rather than being written at the
      # release, so what is announced is what was reviewed with the code.
      - name: Take the release notes from the changelog
        if: github.ref_type == 'tag'
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## " v "([^0-9].*)?$" { capturing = 1; next }
            capturing && /^## / { exit }
            capturing { print }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no section for $version." >&2
            echo "Add '## $version — <date>' describing what changed, then retag." >&2
            echo "A release with no notes tells nobody what they are installing." >&2
            exit 1
          fi

          # Each line is passed as its own argument, so the indentation this file
          # needs never reaches the markdown.
          {
            echo "body<<STAYINSURED_NOTES"
            printf '%s\n' "$notes"
            printf '%s\n' \
              "---" \
              "" \
              "## Installing" \
              "" \
              "**macOS**: open the \`.dmg\` and drag StayInsured to Applications. The app is not signed with an Apple certificate, so the first launch is refused. Open System Settings, then Privacy & Security, and press Open Anyway on the line saying StayInsured was blocked. On macOS 14 and earlier, right-click the app and choose Open instead. Either way, macOS remembers the choice." \
              "" \
              "**Windows**: run the \`.exe\` installer. Windows SmartScreen will warn about an unknown publisher, since the app is not signed; choose More info and then Run anyway." \
              "" \
              "Your data stays on your machine in an encrypted database. Upgrading keeps it: the installer replaces the app, not the data folder." \
              "" \
              "How to use it, one page per operation, with screenshots:" \
              "https://github.com/laksagent-png/StayInsured/blob/main/docs/guide/index.md"
            echo "STAYINSURED_NOTES"
          } >> "$GITHUB_OUTPUT"

      # The encrypted database vendors OpenSSL, and building it needs Perl and
      # NASM. The runner image ships both today; this is here so a change to the
      # image fails as a clear message rather than a wall of C errors.
      - name: Check the OpenSSL build tools are present
        if: matrix.label == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command perl -ErrorAction SilentlyContinue)) {
            choco install -y strawberryperl
          }
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install -y nasm
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - run: npm ci

      # The data layer holds the money and the renewal dates. A release should
      # not be cut while its tests are failing.
      - name: Test the data layer
        if: matrix.label == 'macOS'
        working-directory: src-tauri
        run: cargo test --lib

      # The signing key here is the updater's own minisign key, not an Apple or
      # Windows certificate: it proves a download came from this repository, so
      # an installed app will accept it. Without it the build still produces
      # installers, but no update anyone already running the app can take.
      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          # Empty means no release is created, which is what a manual run wants.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: StayInsured ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          releaseBody: ${{ steps.notes.outputs.body }}

      - name: Keep the installers when there is no release to attach them to
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: StayInsured-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.nsis.zip*
